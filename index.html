<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>訂單 · LINE 推播</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { max-width: 500px; width: 100%; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border-radius: 40px; padding: 30px 24px 36px; box-shadow: 0 25px 40px -12px rgba(0, 20, 30, 0.25); border: 1px solid rgba(255,255,255,0.6); }
    h1 { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 600; color: #1a2e3f; margin-bottom: 8px; }
    h1 i { color: #1e88e5; font-size: 28px; }
    .subhead { color: #3a5a6f; font-size: 15px; padding-left: 14px; margin-bottom: 28px; border-left: 4px solid #1e88e5; }
    .order-summary { background: #ffffffcc; border-radius: 28px; padding: 20px 18px; margin-bottom: 28px; box-shadow: 0 8px 20px -8px rgba(0,40,60,0.12); border: 1px solid rgba(255,255,255,0.7); }
    .item-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e4edf4; }
    .item-row:last-child { border-bottom: none; }
    .item-name { display: flex; align-items: center; gap: 12px; font-weight: 500; color: #1d384b; }
    .item-name i { width: 22px; color: #1e88e5; font-size: 18px; }
    .item-price { font-weight: 600; color: #0b2a3b; }
    .total-line { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 2px dashed #b8d0df; font-size: 20px; font-weight: 700; color: #0b2a3b; }
    .total-line span:last-child { color: #0d47a1; background: #e3f0fa; padding: 2px 16px; border-radius: 60px; font-size: 22px; }
    .line-section { background: #f2f8fe; border-radius: 24px; padding: 18px 18px 20px; margin: 20px 0 28px; border: 1px solid #d7e6f2; }
    .line-label { display: flex; align-items: center; gap: 12px; font-weight: 500; color: #1d4d6b; margin-bottom: 14px; font-size: 15px; }
    .line-label i { font-size: 22px; color: #06c755; }
    .line-preview { background: white; border-radius: 60px; padding: 6px 6px 6px 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #c7ddee; }
    .line-preview span { color: #1e3b4f; font-size: 14px; font-weight: 450; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .line-preview i { background: #06c755; color: white; padding: 10px 16px; border-radius: 40px; font-size: 16px; margin-left: 6px; box-shadow: 0 4px 8px rgba(6, 199, 85, 0.2); }
    .btn-group { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 10px; border: none; border-radius: 60px; font-size: 18px; font-weight: 600; transition: all 0.15s ease; cursor: pointer; border: 1px solid #dbe8f2; background: #fafdff; letter-spacing: 0.3px; }
    .btn-primary { background: #1e88e5; border: 1px solid #1a73c9; color: white; box-shadow: 0 8px 18px -6px #1e88e580; }
    .btn-primary i { color: white; }
    .btn-primary:hover { background: #1565c0; transform: scale(1.01); box-shadow: 0 12px 22px -6px #1565c0b0; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-outline { background: transparent; border: 1px solid #c7ddee; color: #1f4a66; }
    .btn-outline i { color: #1e88e5; }
    .btn-outline:hover { background: #e6f2fc; border-color: #8fb9db; }
    .btn:disabled { opacity: 0.6; filter: grayscale(0.3); pointer-events: none; transform: none; }
    .toast { background: #1d384b; color: #f0f9ff; padding: 14px 24px; border-radius: 60px; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); margin-top: 24px; backdrop-filter: blur(4px); border: 1px solid #3f6b84; transition: all 0.2s; }
    .toast.hidden { display: none; }
    .footer-note { margin-top: 20px; font-size: 13px; color: #5b7e95; text-align: center; border-top: 1px solid #d3e2ef; padding-top: 18px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .badge { background: #d4e5f5; border-radius: 40px; padding: 3px 12px; font-size: 12px; font-weight: 500; color: #135d8a; }
    .push-status { margin: 12px 0 6px; font-size: 14px; color: #1c5d7e; background: #dcecf9; padding: 8px 16px; border-radius: 40px; display: inline-block; }
    .flex { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1><i class="fas fa-clipboard-list"></i> 訂單推播</h1>
    <div class="subhead"><i class="fas fa-arrow-right" style="margin-right: 6px; color: #1e88e5;"></i> 透過 LINE LIFF 發送 Flex Message</div>

    <div class="order-summary">
      <div class="item-row"><span class="item-name"><i class="fas fa-coffee"></i> 經典拿鐵 (大)</span><span class="item-price">$130</span></div>
      <div class="item-row"><span class="item-name"><i class="fas fa-pizza-slice"></i> 瑪格麗特披薩</span><span class="item-price">$280</span></div>
      <div class="item-row"><span class="item-name"><i class="fas fa-cake"></i> 提拉米蘇</span><span class="item-price">$150</span></div>
      <div class="total-line"><span>總計</span><span>$560</span></div>
    </div>

    <div class="line-section">
      <div class="line-label"><i class="fab fa-line"></i> <span>LINE 通知</span><span class="badge">LIFF Flex Message</span></div>
      <div class="line-preview"><span><i class="fas fa-receipt" style="margin-right: 8px; color: #1e88e5;"></i> 訂單 #ORD-20260814</span><i class="fas fa-paper-plane"></i></div>
      <div style="margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap;">
        <span class="push-status" id="pushStatus"><i class="fas fa-circle" style="color: #06c755; font-size: 10px; margin-right: 6px;"></i> 待發送</span>
        <span class="push-status" id="liffStatus" style="background: #e8f0fe; color: #1a4b6d;"><i class="fas fa-spinner fa-pulse" style="margin-right: 6px;"></i> LIFF 初始化中...</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="sendPushBtn"><i class="fab fa-line"></i> 發送 LINE 推播 (LIFF)</button>
      <button class="btn btn-outline" id="resetSimBtn"><i class="fas fa-undo-alt"></i> 重設狀態</button>
    </div>

    <div id="toastMessage" class="toast hidden"><i class="fas fa-check-circle"></i> <span id="toastText">訂單已推播至 LINE</span></div>

    <div class="footer-note">
      <span><i class="fas fa-robot"></i> LIFF v2</span>
      <span><i class="fas fa-shield-alt"></i> 需於 LINE 內開啟</span>
      <span><i class="fas fa-clock"></i> 即時推播</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ⚠️ 請將 YOUR_LIFF_ID 替換為你實際的 LIFF ID
      const LIFF_ID = "YOUR_LIFF_ID";

      const sendBtn = document.getElementById('sendPushBtn');
      const resetBtn = document.getElementById('resetSimBtn');
      const toast = document.getElementById('toastMessage');
      const toastText = document.getElementById('toastText');
      const pushStatus = document.getElementById('pushStatus');
      const liffStatus = document.getElementById('liffStatus');

      const orderData = {
        orderId: 'ORD-20260814',
        items: [
          { name: '經典拿鐵 (大)', price: 130, qty: 1 },
          { name: '瑪格麗特披薩', price: 280, qty: 1 },
          { name: '提拉米蘇', price: 150, qty: 1 }
        ],
        total: 560,
        currency: 'TWD',
        customer: {
          name: '陳嘉吉',
          phone: '0913613725',
          pickup: '2026-07-29 14:00-15:00'
        }
      };

      let liffReady = false;

      function initLIFF() {
        liffStatus.innerHTML = '<i class="fas fa-spinner fa-pulse" style="margin-right: 6px;"></i> LIFF 初始化中...';
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            liffReady = true;
            if (!liff.isLoggedIn()) {
              liffStatus.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right: 6px;"></i> 未登入，請登入 LINE';
              liffStatus.style.background = '#fff3e0';
              liffStatus.style.color = '#b7650e';
              liff.login();
              return;
            }
            liffStatus.innerHTML = '<i class="fas fa-check-circle" style="color: #2e7d32; margin-right: 6px;"></i> LIFF 就緒 ✓';
            liffStatus.style.background = '#dff0d8';
            liffStatus.style.color = '#1e5a3b';
            console.log('✅ LIFF 初始化完成');
          })
          .catch((err) => {
            console.error('❌ LIFF 初始化失敗:', err);
            liffStatus.innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #c62828; margin-right: 6px;"></i> LIFF 初始化失敗';
            liffStatus.style.background = '#fce4e4';
            liffStatus.style.color = '#922';
            showToast('LIFF 初始化失敗: ' + (err.message || '請確認 LIFF ID'), 'error');
          });
      }

      function buildFlexMessage(order) {
        const itemContents = order.items.map(item => ({
          type: "box",
          layout: "horizontal",
          contents: [
            { type: "text", text: item.name, flex: 3, size: "sm" },
            { type: "text", text: `x ${item.qty || 1}`, flex: 1, align: "center", size: "sm" },
            { type: "text", text: `$${item.price}`, flex: 1, align: "end", size: "sm" }
          ]
        }));

        const bodyContents = [
          { type: "text", text: "阿米亞 CAKE.COOKIE", weight: "bold", size: "lg" },
          { type: "text", text: "甜點預購明細", color: "#aaaaaa", size: "sm" },
          { type: "separator", margin: "md" }
        ];
        itemContents.forEach((item, index) => {
          bodyContents.push(item);
          if (index < itemContents.length - 1) {
            bodyContents.push({ type: "separator", margin: "sm" });
          }
        });
        bodyContents.push(
          { type: "separator", margin: "md" },
          { type: "box", layout: "horizontal", contents: [
            { type: "text", text: "總計", weight: "bold", size: "md" },
            { type: "text", text: `$${order.total}`, weight: "bold", size: "md", align: "end" }
          ]},
          { type: "separator", margin: "md" },
          { type: "text", text: `姓名：${order.customer.name}`, size: "sm", margin: "sm" },
          { type: "text", text: `電話：${order.customer.phone}`, size: "sm" },
          { type: "text", text: `取貨：${order.customer.pickup}`, size: "sm" },
          { type: "text", text: `訂單編號：${order.orderId}`, size: "xs", color: "#aaaaaa", margin: "md" }
        );

        return {
          type: "flex",
          altText: `訂單 ${order.orderId} - 總計 $${order.total}`,
          contents: {
            type: "bubble",
            body: { type: "box", layout: "vertical", contents: bodyContents },
            footer: {
              type: "box",
              layout: "vertical",
              contents: [
                { type: "text", text: "感謝您的訂購 ❤️", align: "center", size: "sm", color: "#888888" }
              ]
            }
          }
        };
      }

      async function sendLiffMessage() {
        if (!liffReady) {
          showToast('LIFF 尚未初始化完成，請稍後再試', 'error');
          return;
        }
        if (!liff.isLoggedIn()) {
          showToast('請先登入 LINE 帳號', 'error');
          liff.login();
          return;
        }
        if (!liff.isInClient()) {
          showToast('請在 LINE 應用程式內開啟此頁面', 'error');
          return;
        }

        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 傳送中...';
        pushStatus.innerHTML = `<i class="fas fa-spinner fa-pulse" style="margin-right: 6px;"></i> 傳送中...`;
        pushStatus.style.background = '#e3f0fa';
        pushStatus.style.color = '#11507a';

        try {
          const flexMessage = buildFlexMessage(orderData);
          await liff.sendMessages([flexMessage]);
          pushStatus.innerHTML = `<i class="fas fa-check-circle" style="color: #2e7d32; margin-right: 6px;"></i> 已傳送 (${new Date().toLocaleTimeString('zh-TW')})`;
          pushStatus.style.background = '#dff0d8';
          pushStatus.style.color = '#1e5a3b';
          showToast('✅ 訂單已成功傳送至 LINE 聊天室！', 'success');
        } catch (error) {
          console.error('❌ 傳送失敗:', error);
          pushStatus.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #c62828; margin-right: 6px;"></i> 傳送失敗`;
          pushStatus.style.background = '#fce4e4';
          pushStatus.style.color = '#922';
          showToast('傳送失敗: ' + (error.message || '請重試'), 'error');
        } finally {
          sendBtn.disabled = false;
          sendBtn.innerHTML = '<i class="fab fa-line"></i> 發送 LINE 推播 (LIFF)';
        }
      }

      function showToast(message, type = 'success') {
        toastText.textContent = message;
        toast.className = 'toast';
        toast.style.display = 'inline-flex';
        const icon = toast.querySelector('i');
        if (type === 'success') {
          icon.className = 'fas fa-check-circle';
          icon.style.color = '#66bb6a';
        } else if (type === 'error') {
          icon.className = 'fas fa-exclamation-circle';
          icon.style.color = '#e57373';
        } else {
          icon.className = 'fas fa-info-circle';
          icon.style.color = '#42a5f5';
        }
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
          toast.className = 'toast hidden';
          toast.style.display = 'none';
        }, 5000);
      }

      function resetState() {
        pushStatus.innerHTML = `<i class="fas fa-circle" style="color: #06c755; font-size: 10px; margin-right: 6px;"></i> 待發送`;
        pushStatus.style.background = '#dcecf9';
        pushStatus.style.color = '#1c5d7e';
        toast.className = 'toast hidden';
        toast.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="fab fa-line"></i> 發送 LINE 推播 (LIFF)';
      }

      sendBtn.addEventListener('click', sendLiffMessage);
      resetBtn.addEventListener('click', resetState);
      toast.addEventListener('click', function() {
        this.className = 'toast hidden';
        this.style.display = 'none';
      });

      initLIFF();
      console.log('📋 訂單 LIFF 頁面已載入');
    })();
  </script>
</body>
</html>
